name: Tests du Semainier

on:
  push:
    paths:
      - 'lidl-recettes/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'lidl-recettes/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lidl-recettes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe du service worker
        run: node --check sw.js
      - name: Lancer les tests
        run: npm test
