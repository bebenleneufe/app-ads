name: Publier sur GitHub Pages

# Publie le dépôt (sans le projet Android) : app-ads.txt reste à la racine du site,
# l'appli est servie sous /lidl-recettes/ avec son APK Android.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lidl-recettes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}lidl-recettes/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les outils Android
        # « yes » s'arrête en erreur quand sdkmanager ferme le tube : on l'ignore pour pipefail.
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      # Le numéro d'exécution sert de numéro de version : chaque APK publié peut remplacer le précédent.
      - name: Fabriquer l'APK
        run: android/build.sh lidl-recettes/semainier-lidl.apk "$GITHUB_RUN_NUMBER"
      - name: Préparer le site
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude android ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
